name: Set up toolchain
description: pnpm, Node from .nvmrc with a pnpm cache, and a frozen-lockfile install.
# Assumes the repo is already checked out: a local action cannot be resolved before that.

inputs:
  registry-url:
    description: npm registry to configure for publishing. Omit unless the job publishes.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up pnpm
      # Pinned here rather than via a `packageManager` field in package.json: that field is
      # enforced by Corepack and by pnpm itself, which would lock every contributor to one
      # exact version. CI needs a reproducible pnpm; local clones do not.
      uses: pnpm/action-setup@v4
      with:
        version: '11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
