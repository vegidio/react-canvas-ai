name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Lint and format
        run: pnpm exec biome ci .

      # Must precede the typecheck: the playground imports `react-canvas-ai` through the
      # package exports, whose "types" point at dist/. On a clean checkout those .d.ts
      # files do not exist yet and every import from the library resolves to `any`.
      - name: Build library
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter react-canvas-ai test:coverage

      - name: Verify package types resolve
        run: pnpm --filter react-canvas-ai exec attw --pack .

      - name: Build playground
        run: pnpm --filter playground build
