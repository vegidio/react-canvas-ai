name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter react-canvas-ai test:coverage

      - name: Build library
        run: pnpm build

      - name: Verify package types resolve
        run: pnpm --filter react-canvas-ai exec attw --pack .

      # CalVer is stamped by scripts/calver.mjs, which Changesets does not know about.
      # Fail loudly here rather than publishing a stray semver to npm.
      - name: Verify version is CalVer
        run: |
          version=$(node -p "require('./packages/react-canvas-ai/package.json').version")
          echo "version: $version"
          echo "$version" | grep -Eq '^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$' \
            || { echo "::error::version '$version' is not YY.M.MICRO"; exit 1; }

      - name: Build playground
        run: pnpm --filter playground build
