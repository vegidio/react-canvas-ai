name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (YY.M.MICRO), e.g. 26.8.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The git tag is the source of truth for the version. Reject a malformed one here,
      # before anything is installed or built.
      - name: Resolve version
        id: version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          version="${raw#v}"
          echo "version: $version"
          echo "$version" | grep -Eq '^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$' \
            || { echo "::error::version '$version' is not YY.M.MICRO"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp version
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Verify (Biome + typecheck + tests)
        run: pnpm check

      - name: Build library
        run: pnpm build

      # --no-git-checks: the tree is dirty from the stamp and HEAD is detached on the tag.
      # `access: public` comes from the package's publishConfig.
      - name: Publish to npm
        run: pnpm --filter react-canvas-ai publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
