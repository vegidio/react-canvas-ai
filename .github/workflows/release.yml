name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (YY.M.MICRO), e.g. 26.8.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The git tag is the source of truth for the version. `set-version.mjs` owns the
      # format check and rejects a malformed one before publish; this only strips the
      # optional `v` prefix.
      - name: Resolve version
        id: version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Stamp version
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      # `pnpm check` is Biome + build + typecheck + tests, so dist/ is ready after this.
      - name: Verify and build
        run: pnpm check

      # --no-git-checks: the tree is dirty from the stamp and HEAD is detached on the tag.
      # `access: public` comes from the package's publishConfig.
      - name: Publish to npm
        run: pnpm --filter react-canvas-ai publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
